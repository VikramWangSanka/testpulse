[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testpulse"
version = "0.1.0"
description = "Test result history and flaky-test detection service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
